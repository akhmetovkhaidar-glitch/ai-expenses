<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Expenses</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        label, button, select, input { margin: 0.3rem 0; font-size: 1rem; }
        input, select { padding: 0.4rem; }
        ul { padding-left: 1.2rem; }
        pre { white-space: pre-wrap; background: #34aea3; padding: 1rem; border-radius: 6px; }
        .error { color: #9c113e; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
    </style>
</head>
<body>
<h1>AI Budget Tracker</h1>

<label>Monthly income (EUR):<br>
    <input type="number" id="income" step="1" min="0">
</label>

<h2>Expenses</h2>
<select id="category">
    <option value="RENT">Rent</option>
    <option value="GROCERIES">Groceries</option>
    <option value="CAFE">Cafe</option>
    <option value="TRANSPORT">Transport</option>
</select>
<input type="number" id="amount" step="0.01" min="0.01" placeholder="Amount">
<button onclick="addExpense()">Add</button>
<ul id="list"></ul>

<button onclick="send('/api/summary')">Calculate</button>
<button onclick="send('/api/analysis')">AI analysis</button>

<p id="error" class="error"></p>
<h2>Summary</h2>
<pre id="summary"></pre>
<h2>AI analysis</h2>
<pre id="analysis"></pre>

<script>
    async function send(url) {
        const income = parseFloat(document.getElementById("income").value);
        const error = document.getElementById("error");
        error.textContent = "";
        if (!income || income <= 0) {
            error.textContent = "Please enter your monthly income.";
            return;
        }
        document.getElementById("summary").textContent = "";
        document.getElementById("analysis").textContent = "";
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ income })
            });
            const data = await response.json();
            if (!response.ok) {
                error.textContent = data.error || "Unknown error";
                return;
            }
            document.getElementById("summary").textContent = data.summary || "";
            document.getElementById("analysis").textContent = data.analysis || "";
        } catch (e) {
            error.textContent = "Server not reachable.";
        }
    }

    async function loadExpenses() {
        const response = await fetch("/api/expenses");
        const data = await response.json();
        const list = document.getElementById("list");
        list.innerHTML = "";
        for (const e of data) {
            const li = document.createElement("li");
            li.textContent = e.category + ": " + e.amount + " EUR ";
            const btn = document.createElement("button");
            btn.textContent = "Delete";
            btn.onclick = () => deleteExpense(e.id);
            li.appendChild(btn);
            list.appendChild(li);
        }
    }

    async function addExpense() {
        const category = document.getElementById("category").value;
        const amount = parseFloat(document.getElementById("amount").value);
        const error = document.getElementById("error");
        if (!amount || amount <= 0) {
            error.textContent = "Please enter a valid amount.";
            return;
        }
        error.textContent = "";
        const response = await fetch("/api/expenses", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ category, amount })
        });
        if (!response.ok) {
            const data = await response.json();
            error.textContent = data.error || "Unknown error";
            return;
        }
        document.getElementById("amount").value = "";
        loadExpenses();
    }

    async function deleteExpense(id) {
        await fetch("/api/expenses/" + id, { method: "DELETE" });
        loadExpenses();
    }

    loadExpenses();
</script>
</body>
</html>
